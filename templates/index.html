<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
  <!-- Updated Font Links to include Space Grotesk and Material Symbols -->
  <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700" onload="this.rel='stylesheet'" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <title>Malware Analysis Dashboard</title> <!-- Updated Title -->
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style type="text/tailwindcss">
    :root {
      /* Updated primary color to match new design */
      --primary-color: #1993e5;
    }
    /* Pulsing border animation from new design */
    .pulsing-border {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
     @keyframes pulse {
      50% {
        border-color: var(--primary-color);
      }
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
      /* Updated font family and background to match new design */
      font-family: "Space Grotesk", "Noto Sans", sans-serif;
      background-color: #0F172A; /* bg-slate-900 as per new outer body */
    }
    /* Custom scrollbar for log viewer (can be reused or adapted) */
    .log-viewer::-webkit-scrollbar {
      width: 8px;
    }
    .log-viewer::-webkit-scrollbar-track {
      background: #1E293B; /* slate-800 */
      border-radius: 10px;
    }
    .log-viewer::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 10px;
    }
    .log-viewer::-webkit-scrollbar-thumb:hover {
      background: #137abd; /* Slightly darker primary color */
    }
  </style>
</head>
<body class="bg-gray-900 text-white">
  <div class="relative flex size-full min-h-screen flex-col bg-[#111827] dark justify-between group/design-root overflow-x-hidden">
    <!-- Header from the new design -->
    <header class="flex items-center justify-between p-4 border-b border-gray-800">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[var(--primary-color)] text-2xl">shield</span>
        <h1 class="text-white text-lg font-bold">MA</h1> <!-- Malware Analysis -->
      </div>
      <button id="menu-button" class="text-white">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </header>

    <!-- New <main> section injected here -->
    <main class="flex-grow flex flex-col p-4 justify-center">
      <div id="upload-zone" class="flex flex-col items-center gap-6 rounded-lg border-2 border-dashed border-gray-700 px-6 py-20 pulsing-border cursor-pointer">
        <div class="flex flex-col items-center gap-4">
          <span class="material-symbols-outlined text-gray-400 text-6xl">upload_file</span>
          <p class="text-white text-lg font-bold leading-tight text-center">
            Drag & Drop your file here to Scan for Threats.
          </p>
          <p class="text-gray-400 text-sm">or <span class="text-[var(--primary-color)] font-semibold">tap to browse</span> or <span class="text-[var(--primary-color)] font-semibold">paste from clipboard</span></p>
        </div>
      </div>
      <!-- Container for dynamically added content like scanning animation, logs, and summary card -->
      <div id="analysis-content-area" class="mt-8">
        <!-- JS will populate this area -->
      </div>
    </main>

    <!-- Footer from the new design -->
    <footer class="flex flex-col items-center gap-4 px-5 py-8 text-center bg-[#111827] border-t border-gray-800">
      <div id="did-you-know-tip-container" class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[var(--primary-color)] text-xl">lightbulb</span>
        <p id="did-you-know-text" class="text-gray-400 text-sm font-normal leading-normal">
          <span class="font-bold text-gray-300">Did you know?</span> Enable Sysmon logging for deeper visibility.
        </p>
      </div>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const uploadZone = document.getElementById('upload-zone');
      const analysisContentArea = document.getElementById('analysis-content-area');
      const didYouKnowTextElement = document.getElementById('did-you-know-text');

      let eventSource = null;
      const reportFileUrls = { evtx: null, csv: null };

      const tips = [
        "Enable Sysmon logging for deeper visibility into system activities.",
        "Regularly update your malware definitions and scan engines.",
        "Always be cautious with files from untrusted or unknown sources.",
        "Consider using virtual machines or sandboxes for analyzing suspicious files safely.",
        "Look for unusual network connections or processes as potential indicators of compromise."
      ];
      let currentTipIndex = Math.floor(Math.random() * tips.length);

      function rotateTip() {
        currentTipIndex = (currentTipIndex + 1) % tips.length;
        if (didYouKnowTextElement) {
            didYouKnowTextElement.innerHTML = `<span class="font-bold text-gray-300">Did you know?</span> ${tips[currentTipIndex]}`;
        }
      }

      function clearAnalysisUI() {
        analysisContentArea.innerHTML = '';
        reportFileUrls.evtx = null;
        reportFileUrls.csv = null;
        if (eventSource) {
          eventSource.close();
          eventSource = null;
        }
        if(uploadZone) uploadZone.style.display = 'flex';
      }

      function showScanningState(fileName) {
        if(uploadZone) uploadZone.style.display = 'none';
        analysisContentArea.innerHTML = `
          <div class="flex flex-col items-center justify-center p-6 bg-gray-800 rounded-lg shadow-md">
            <div class="relative w-20 h-20">
              <svg class="absolute inset-0 animate-spin w-full h-full text-[var(--primary-color)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span class="material-symbols-outlined absolute inset-0 flex items-center justify-center text-3xl text-[var(--primary-color)]">security</span>
            </div>
            <p class="text-white mt-4 text-lg">Scanning: <span class="font-semibold">${fileName}</span></p>
            <p id="scan-stage-text" class="text-gray-400 text-sm mt-1">Initializing...</p>
            <div class="w-full max-w-md mt-6">
                <button id="toggle-logs-btn" class="w-full text-sm text-[var(--primary-color)] py-2 px-3 rounded-md hover:bg-gray-700 transition-colors mb-2">Show Live Logs</button>
                <div id="live-logs-panel" class="w-full bg-gray-900 rounded-lg p-3 text-xs font-mono h-40 overflow-y-auto log-viewer hidden">
                    <div id="live-logs-content"><!-- Logs will appear here --></div>
                </div>
            </div>
          </div>`;

        const toggleBtn = document.getElementById('toggle-logs-btn');
        const logsPanel = document.getElementById('live-logs-panel');
        if(toggleBtn && logsPanel){
            toggleBtn.addEventListener('click', () => {
                logsPanel.classList.toggle('hidden');
                toggleBtn.textContent = logsPanel.classList.contains('hidden') ? 'Show Live Logs' : 'Hide Live Logs';
            });
        }
      }

      function updateScanStageText(message) {
        const stageTextElement = document.getElementById('scan-stage-text');
        if (stageTextElement) {
          if(message.startsWith("[STAGE]")){
            stageTextElement.textContent = message.substring("[STAGE]".length).split("...")[0].trim();
          } else if (message.startsWith("Scan process starting")) {
            stageTextElement.textContent = "Initiating scan sequence...";
          } else if (message.startsWith("--- Malware Analysis Script Finished ---")) {
            stageTextElement.textContent = "Finalizing report...";
          }
        }
      }

      function appendLiveLog(rawMessage) {
        const logsContent = document.getElementById('live-logs-content');
        if (!logsContent) return;

        // Remove "data: " prefix if present (common in SSE)
        const message = rawMessage.startsWith('data: ') ? rawMessage.substring(6) : rawMessage;

        // Skip empty messages or the final JSON event here
        if (!message.trim() || message.startsWith('{"event":"scan_complete"')) return;

        const p = document.createElement('p');
        p.className = 'whitespace-pre-wrap break-all text-gray-300';

        if (message.startsWith('[INFO]') || message.startsWith('[VMRUN]')) {
            p.innerHTML = `<span class="text-blue-400">${message.split(']')[0]}]</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else if (message.startsWith('[STAGE_COMPLETE]') || message.startsWith('[AUTOMATION_SUCCESS]')) {
            p.innerHTML = `<span class="text-green-400">${message.split(']')[0]}]</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else if (message.startsWith('[ERROR]') || message.startsWith('[VMRUN_ERROR]') || message.startsWith('[CRITICAL_ERROR]') || message.startsWith('[AUTOMATION_FAILED]')) {
            p.innerHTML = `<span class="text-red-400">${message.split(']')[0]}]</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else if (message.startsWith('[WARN]') || message.startsWith('[VMRUN_WARNING]')) {
            p.innerHTML = `<span class="text-yellow-400">${message.split(']')[0]}]</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else if (message.startsWith('[STAGE]')) {
            p.innerHTML = `<span class="text-purple-400">${message.split(']')[0]}]</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else {
            p.textContent = message;
        }
        logsContent.appendChild(p);
        logsContent.scrollTop = logsContent.scrollHeight;
      }

      function displayThreatSummary(summary) {
        clearAnalysisUI();
        const { evtxUrl, csvUrl, threatLevel, threatFamily, confidence, indicators, analyzedFile } = summary;

        reportFileUrls.evtx = evtxUrl;
        reportFileUrls.csv = csvUrl;

        let threatColorClass = 'bg-gray-600 text-gray-100';
        let threatIcon = 'help'; // Default icon

        switch (String(threatLevel).toLowerCase()) {
            case 'critical': threatColorClass = 'bg-red-700 text-red-100'; threatIcon = 'gpp_bad'; break;
            case 'high':     threatColorClass = 'bg-red-500 text-red-100'; threatIcon = 'warning'; break;
            case 'medium':   threatColorClass = 'bg-yellow-500 text-yellow-100'; threatIcon = 'report_problem'; break;
            case 'low':      threatColorClass = 'bg-green-500 text-green-100'; threatIcon = 'verified_user'; break;
            case 'informational': threatColorClass = 'bg-blue-500 text-blue-100'; threatIcon = 'info'; break;
            default:         threatLevel = threatLevel || "N/A";
        }

        const indicatorsHtml = Array.isArray(indicators) && indicators.length > 0
            ? indicators.map(ind => `<li class="text-gray-300 flex items-start"><span class="material-symbols-outlined text-sm text-[var(--primary-color)] mr-2 mt-1">flag</span>${ind}</li>`).join('')
            : '<li class="text-gray-400">No specific indicators identified.</li>';

        analysisContentArea.innerHTML = `
          <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-lg mx-auto">
            <div class="text-center mb-6">
              <span class="material-symbols-outlined text-5xl ${threatColorClass.split(' ')[1]} mb-2">${threatIcon}</span>
              <h2 class="text-3xl font-bold text-white">Scan Report: ${analyzedFile || 'File'}</h2>
              <p class="text-sm text-gray-400">Analysis completed.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-center">
              <div>
                <span class="text-xs text-gray-400 block uppercase tracking-wider">Threat Level</span>
                <span class="px-3 py-1 mt-1 text-base font-semibold ${threatColorClass} rounded-full inline-block">${threatLevel}</span>
              </div>
              <div>
                <span class="text-xs text-gray-400 block uppercase tracking-wider">Malware Family</span>
                <p class="text-lg text-white mt-1">${threatFamily || 'Undetermined'}</p>
              </div>
              <div>
                <span class="text-xs text-gray-400 block uppercase tracking-wider">Confidence</span>
                <p class="text-lg text-white mt-1">${confidence || 'N/A'}</p>
              </div>
            </div>

            <div class="mb-6 bg-gray-900 p-4 rounded-md">
              <h3 class="text-lg font-semibold text-white mb-2 flex items-center"><span class="material-symbols-outlined text-[var(--primary-color)] mr-2">checklist</span>Key Indicators</h3>
              <ul class="space-y-1 pl-1">${indicatorsHtml}</ul>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 mb-3">
              ${reportFileUrls.evtx ? `<a href="/download/${encodeURIComponent(reportFileUrls.evtx)}" download class="flex-1 text-center bg-[var(--primary-color)] hover:bg-blue-500 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors duration-150 ease-in-out flex items-center justify-center gap-2"><span class="material-symbols-outlined text-lg">description</span>Download EVTX</a>` : ''}
              ${reportFileUrls.csv ? `<a href="/download/${encodeURIComponent(reportFileUrls.csv)}" download class="flex-1 text-center bg-gray-600 hover:bg-gray-500 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors duration-150 ease-in-out flex items-center justify-center gap-2"><span class="material-symbols-outlined text-lg">list_alt</span>Download CSV</a>` : ''}
            </div>
            <button id="copy-report-link-btn" class="w-full bg-transparent hover:bg-gray-700/50 text-[var(--primary-color)] font-semibold py-2.5 px-4 border border-[var(--primary-color)] rounded-lg transition-colors duration-150 ease-in-out flex items-center justify-center gap-2">
              <span class="material-symbols-outlined text-lg">link</span>Copy Report Link
            </button>
            <p id="copy-link-feedback" class="text-xs text-green-400 text-center mt-2 h-4"></p>
          </div>`;

        document.getElementById('copy-report-link-btn')?.addEventListener('click', () => {
            const shareableLink = window.location.href + "?report_id=" + encodeURIComponent(analyzedFile || 'scan'); // Placeholder ID
            const feedbackEl = document.getElementById('copy-link-feedback');
            navigator.clipboard.writeText(shareableLink).then(() => {
                if(feedbackEl) feedbackEl.textContent = 'Link copied to clipboard!';
                setTimeout(() => { if(feedbackEl) feedbackEl.textContent = ''; }, 2000);
            }).catch(err => {
                console.error('Failed to copy link: ', err);
                if(feedbackEl) feedbackEl.textContent = 'Failed to copy.';
                setTimeout(() => { if(feedbackEl) feedbackEl.textContent = ''; }, 2000);
            });
        });
        rotateTip();
      }

      if (uploadZone) {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '*/*';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput); // Append to body to ensure it's part of DOM for click

        uploadZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadZone.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                uploadZone.classList.add('border-[var(--primary-color)]', 'bg-gray-800/50');
            });
        });
        ['dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                uploadZone.classList.remove('border-[var(--primary-color)]', 'bg-gray-800/50');
            });
        });
        uploadZone.addEventListener('drop', (e) => {
          const files = e.dataTransfer.files;
          if (files.length > 0) handleFileUpload(files[0]);
        });
        fileInput.addEventListener('change', (e) => {
          const files = e.target.files;
          if (files.length > 0) {
            handleFileUpload(files[0]);
            fileInput.value = '';
          }
        });

        document.addEventListener('paste', (event) => {
            let isPastingOnUploadZone = uploadZone.contains(event.target) || event.target === uploadZone;
            if (!isPastingOnUploadZone && uploadZone.style.display !== 'none') {
                if (!(event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement || event.target.isContentEditable)) {
                    isPastingOnUploadZone = true;
                }
            }
            if (isPastingOnUploadZone) {
                const items = (event.clipboardData || window.clipboardData).items;
                let fileToUpload = null;
                for (const item of items) {
                    if (item.kind === 'file') { fileToUpload = item.getAsFile(); break; }
                }
                if (fileToUpload) { event.preventDefault(); handleFileUpload(fileToUpload); }
            }
        });
      }

      function handleFileUpload(file) {
        if (!file) return;
        showScanningState(file.name);

        const formData = new FormData();
        formData.append('file', file);

        fetch('/upload', { method: 'POST', body: formData })
        .then(response => {
            if (!response.ok) {
                return response.json().then(errData => { throw new Error(errData.detail || `Upload failed: ${response.statusText}`); });
            }
            return response.json();
        })
        .then(data => {
          if (data.filePath) startScan(data.filePath);
          else throw new Error('File path not returned from upload.');
        })
        .catch(error => {
          console.error('Upload error:', error);
          clearAnalysisUI();
          analysisContentArea.innerHTML = `<div class="text-center p-4"><p class="text-red-400">Upload failed: ${error.message}.</p><button id="try-again-btn" class="mt-2 px-4 py-2 bg-[var(--primary-color)] text-white rounded hover:bg-blue-500">Try Again</button></div>`;
          document.getElementById('try-again-btn')?.addEventListener('click', clearAnalysisUI);
        });
      }

      function startScan(filePath) {
        updateScanStageText("Scan initiated for: " + filePath.split(/[/\\]/).pop());

        eventSource = new EventSource(`/start-scan?file_path=${encodeURIComponent(filePath)}`);

        eventSource.onopen = () => {
          appendLiveLog('data: Connection to scan server established...');
          updateScanStageText("Connection established. Starting analysis...");
        };

        eventSource.onmessage = (event) => {
          const rawMessage = event.data;

          try {
            const parsedEvent = JSON.parse(rawMessage); // SSE data is always string
            if (parsedEvent.event === 'scan_complete' && parsedEvent.data) {
              displayThreatSummary(parsedEvent.data);
              if(eventSource) eventSource.close();
              return;
            }
             appendLiveLog(rawMessage); // Log other JSON messages as is
          } catch (e) {
            // Not a JSON event, treat as a normal log line
            appendLiveLog(rawMessage); // rawMessage already includes "data: " if sent like that by server
            updateScanStageText(rawMessage.startsWith('data: ') ? rawMessage.substring(6) : rawMessage);
          }

          // Fallback for script completion if scan_complete JSON not received
          const messageContent = rawMessage.startsWith('data: ') ? rawMessage.substring(6) : rawMessage;
          if (messageContent === 'SCRIPT_DONE' || messageContent === 'Automation completed successfully.') {
            appendLiveLog("data: Scan process marked as DONE by script (fallback).");
            if (!document.getElementById('copy-report-link-btn')) {
                 displayThreatSummary({
                    threatLevel: 'Unknown', threatFamily: 'N/A', confidence: 'N/A',
                    indicators: ['Scan ended via SCRIPT_DONE. Final structured report might be missing.'],
                    evtxUrl: reportFileUrls.evtx, csvUrl: reportFileUrls.csv, analyzedFile: filePath.split(/[/\\]/).pop()
                });
            }
            if(eventSource) eventSource.close();
          } else if (messageContent === 'SCRIPT_ERROR' || messageContent.includes("AUTOMATION_FAILED")) {
            appendLiveLog("data: Scan process encountered an ERROR (fallback).");
             if (!document.getElementById('copy-report-link-btn')) {
                displayThreatSummary({
                    threatLevel: 'Error', threatFamily: 'N/A', confidence: 'N/A',
                    indicators: ['Scan failed or ended with an error.'],
                    evtxUrl: reportFileUrls.evtx, csvUrl: reportFileUrls.csv, analyzedFile: filePath.split(/[/\\]/).pop()
                });
            }
            if(eventSource) eventSource.close();
          }
        };

        eventSource.onerror = (err) => {
          console.error('EventSource error:', err);
          appendLiveLog('data: Connection to scan server error/lost.');
          const stageTextEl = document.getElementById('scan-stage-text');
          if(stageTextEl) {
            stageTextEl.textContent = 'Error: Connection lost.';
            stageTextEl.classList.add('text-red-400');
          } else {
             clearAnalysisUI();
             analysisContentArea.innerHTML = `<div class="text-center p-4"><p class="text-red-400">Error: Connection to scan server lost.</p><button id="try-again-btn" class="mt-2 px-4 py-2 bg-[var(--primary-color)] text-white rounded hover:bg-blue-500">Try Again</button></div>`;
             document.getElementById('try-again-btn')?.addEventListener('click', clearAnalysisUI);
          }
          if(eventSource) eventSource.close();
        };
      }

      clearAnalysisUI();
      rotateTip();
    });
  </script>
</body>
</html>
