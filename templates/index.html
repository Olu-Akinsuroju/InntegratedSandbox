<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>

  <title>VM Automation Tool</title>
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style type="text/tailwindcss">
    :root {
      --primary-color: #0c7ff2;
      --secondary-color: #1f2937;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --background-primary: #111827;
      --background-secondary: #1f2937;
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
      font-family: Inter, "Noto Sans", sans-serif;
    }
    /* Custom scrollbar for log viewer */
    .log-viewer::-webkit-scrollbar {
      width: 8px;
    }
    .log-viewer::-webkit-scrollbar-track {
      background: var(--background-secondary);
      border-radius: 10px;
    }
    .log-viewer::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 10px;
    }
    .log-viewer::-webkit-scrollbar-thumb:hover {
      background: #0a6ac0; /* Slightly darker blue on hover */
    }
    .status-icon svg {
        animation-duration: 1.5s; /* For things like animate-pulse */
    }
  </style>
</head>
<body class="bg-background-primary text-text-primary">
  <div class="relative flex size-full min-h-screen flex-col overflow-x-hidden">
    <header class="sticky top-0 z-10 bg-background-primary/80 backdrop-blur-sm">
      <div class="flex items-center p-4 justify-between">
        <h1 class="text-xl font-bold tracking-tight flex-1 text-center pl-10">VM Automation</h1>
        <div class="flex w-10 items-center justify-end">
          <button class="flex items-center justify-center rounded-full h-10 w-10 hover:bg-background-secondary transition-colors">
            <svg class="text-text-primary" fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">

    <main class="flex-1 px-4 py-6 space-y-8">
      <button id="runAutomationBtn" class="flex w-full items-center justify-center rounded-xl h-14 px-6 bg-[var(--primary-color)] text-white text-lg font-bold shadow-lg shadow-blue-500/30 hover:bg-blue-600 transition-all duration-300 ease-in-out transform hover:scale-105">

      <section>
        <h2 class="text-2xl font-bold tracking-tight mb-4">Status</h2>

            </div>
          </div>
        </div>
      </section>
      <section>
        <h2 class="text-2xl font-bold tracking-tight mb-4">Log Viewer</h2>
        <div id="logViewer" class="bg-background-secondary rounded-lg p-4 font-mono text-sm h-60 overflow-y-auto log-viewer">
          <!-- Log messages will be appended here -->

      <section>
        <h2 class="text-2xl font-bold tracking-tight mb-4">Files</h2>
        <div id="filesContainer" class="space-y-3">
          <!-- File download links will be dynamically inserted here -->
          <p class="text-text-secondary">Generated files will be available for download here after completion.</p>
        </div>
      </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const runAutomationBtn = document.getElementById('runAutomationBtn');
      const statusContainer = document.getElementById('statusContainer');
      const logViewer = document.getElementById('logViewer');
      const filesContainer = document.getElementById('filesContainer');

      let eventSource = null;
      const generatedFilePaths = {
        evtx: null,
        csv: null
      };

      const initialStatusHtml = `
        <div class="flex items-center gap-4 opacity-50">
          <div class="status-icon flex items-center justify-center rounded-full bg-gray-500/20 text-gray-400 shrink-0 size-10">
            <svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,24a12,12,0,1,1-12-12A12,12,0,0,1,128,160Z"></path></svg>
          </div>
          <div class="flex-1">
            <p class="font-medium">Waiting to start...</p>
            <p class="text-sm text-text-secondary">Click "Run Automation" to begin.</p>
          </div>
        </div>`;

      const initialLogHtml = `<p class="text-text-secondary">Logs will appear here once the automation starts...</p>`;
      const initialFilesHtml = `<p class="text-text-secondary">Generated files will be available for download here after completion.</p>`;

      const statusPhases = [
        { id: 'revert_vm', text: 'Reverting VM to Snapshot', keywords: ['Reverting to snapshot', 'VM Reverted'] },
        { id: 'start_vm', text: 'Starting VM', keywords: ['Starting VM', 'VM started', 'VM Reverted and Started'] },
        { id: 'export_sysmon', text: 'Exporting Sysmon Logs', keywords: ['Exporting Sysmon EVTX', 'Sysmon EVTX Exported'] },
        { id: 'convert_csv', text: 'Converting Logs to CSV', keywords: ['Converting EVTX to CSV', 'EVTX to CSV Converted'] },
        { id: 'transfer_files', text: 'Transferring Files to Host', keywords: ['Copying files to host', 'Files Copied to Host'] },
        { id: 'completed', text: 'Automation Process Finished', keywords: ['Automation completed successfully', 'AUTOMATION_SUCCESS', 'SCRIPT_DONE'] }
      ];
      let currentPhaseIndex = -1;

      function resetUI() {
        runAutomationBtn.disabled = false;
        runAutomationBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        runAutomationBtn.querySelector('span').textContent = 'Run Automation';

        statusContainer.innerHTML = initialStatusHtml;
        logViewer.innerHTML = initialLogHtml;
        filesContainer.innerHTML = initialFilesHtml;

        currentPhaseIndex = -1;
        generatedFilePaths.evtx = null;
        generatedFilePaths.csv = null;

        if (eventSource) {
          eventSource.close();
          eventSource = null;
        }
      }

      function createStatusElement(id, text, status = 'pending') {
        // Status: 'pending', 'in-progress', 'completed', 'error'
        let iconHtml = '';
        let bgColor = 'bg-gray-500/20';
        let textColor = 'text-gray-400';
        let statusText = 'Pending';
        let pulse = false;

        if (status === 'in-progress') {
          iconHtml = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"></path></svg>`;
          bgColor = 'bg-yellow-500/20';
          textColor = 'text-yellow-400';
          statusText = 'In Progress';
          pulse = true;
        } else if (status === 'completed') {
          iconHtml = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path></svg>`;
          bgColor = 'bg-green-500/20';
          textColor = 'text-green-400';
          statusText = 'Completed';
        } else if (status === 'error') {
          iconHtml = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M128,24a104,104,0,1,0,232,128,104.11,104.11,0,0,0-128-24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,24a12,12,0,1,1-12-12A12,12,0,0,1,128,160Z"></path></svg>`; // Error icon (e.g. exclamation)
          bgColor = 'bg-red-500/20';
          textColor = 'text-red-400';
          statusText = 'Error';
        } else { // pending
          iconHtml = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,24a12,12,0,1,1-12-12A12,12,0,0,1,128,160Z"></path></svg>`; // Pending icon (info or clock)
        }

        return `
          <div id="status-${id}" class="flex items-center gap-4">
            <div class="status-icon flex items-center justify-center rounded-full ${bgColor} ${textColor} shrink-0 size-10 ${pulse ? 'animate-pulse' : ''}">
              ${iconHtml}
            </div>
            <div class="flex-1">
              <p class="font-medium">${text}</p>
              <p class="status-text text-sm text-text-secondary">${statusText}</p>
            </div>
          </div>
        `;
      }

      function updateStatusUI(logMessage) {
        if (currentPhaseIndex + 1 >= statusPhases.length) return;

        const nextPhase = statusPhases[currentPhaseIndex + 1];
        let phaseMatched = false;

        for (const keyword of nextPhase.keywords) {
            if (logMessage.includes(keyword)) {
                phaseMatched = true;
                break;
            }
        }

        if (phaseMatched) {
            // Mark previous phase as completed if it exists and wasn't an error
            if (currentPhaseIndex >= 0) {
                const prevPhase = statusPhases[currentPhaseIndex];
                const prevStatusElement = document.getElementById(`status-${prevPhase.id}`);
                if (prevStatusElement && !prevStatusElement.querySelector('.text-red-400')) {
                     const iconDiv = prevStatusElement.querySelector('.status-icon');
                     iconDiv.classList.remove('bg-yellow-500/20', 'text-yellow-400', 'animate-pulse');
                     iconDiv.classList.add('bg-green-500/20', 'text-green-400');
                     iconDiv.innerHTML = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path></svg>`;
                     prevStatusElement.querySelector('.status-text').textContent = 'Completed';
                }
            }
            currentPhaseIndex++;

            // If this is not the final "completed" phase, mark it as in-progress
            if (nextPhase.id !== 'completed') {
                const currentStatusElement = document.getElementById(`status-${nextPhase.id}`);
                const iconDiv = currentStatusElement.querySelector('.status-icon');
                iconDiv.classList.remove('bg-gray-500/20', 'text-gray-400');
                iconDiv.classList.add('bg-yellow-500/20', 'text-yellow-400', 'animate-pulse');
                iconDiv.innerHTML = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"></path></svg>`;
                currentStatusElement.querySelector('.status-text').textContent = 'In Progress';
            } else { // This is the "completed" phase
                 const currentStatusElement = document.getElementById(`status-${nextPhase.id}`);
                 const iconDiv = currentStatusElement.querySelector('.status-icon');
                 iconDiv.classList.remove('bg-gray-500/20', 'text-gray-400', 'animate-pulse');
                 iconDiv.classList.add('bg-green-500/20', 'text-green-400');
                 iconDiv.innerHTML = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path></svg>`;
                 currentStatusElement.querySelector('.status-text').textContent = 'Completed';
            }
        } else if (logMessage.includes("ERROR") || logMessage.includes("FAILED") || logMessage.includes("CRITICAL_ERROR")) {
             // Mark current or next phase as error if an error message appears
            const phaseToMarkError = statusPhases[currentPhaseIndex +1] || statusPhases[currentPhaseIndex];
            if (phaseToMarkError) {
                const errorStatusElement = document.getElementById(`status-${phaseToMarkError.id}`);
                if(errorStatusElement) {
                    const iconDiv = errorStatusElement.querySelector('.status-icon');
                    iconDiv.classList.remove('bg-yellow-500/20', 'text-yellow-400', 'animate-pulse', 'bg-gray-500/20', 'text-gray-400');
                    iconDiv.classList.add('bg-red-500/20', 'text-red-400');
                    iconDiv.innerHTML = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M128,24a104,104,0,1,0,232,128,104.11,104.11,0,0,0-128-24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,24a12,12,0,1,1-12-12A12,12,0,0,1,128,160Z"></path></svg>`;
                    errorStatusElement.querySelector('.status-text').textContent = 'Error';
                }
            }
        }
      }

      function appendLogMessage(message) {
        if (logViewer.innerHTML === initialLogHtml) {
          logViewer.innerHTML = ''; // Clear placeholder
        }
        const p = document.createElement('p');
        let displayMessage = message;

        // Simple coloring for common patterns
        if (message.startsWith('[INFO]') || message.startsWith('[VMRUN]')) {
            p.innerHTML = `<span class="text-blue-400 mr-1">${message.substring(0, message.indexOf(']') + 1)}</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else if (message.startsWith('[OK]') || message.startsWith('[STAGE_COMPLETE]') || message.startsWith('[AUTOMATION_SUCCESS]')) {
            p.innerHTML = `<span class="text-green-400 mr-1">${message.substring(0, message.indexOf(']') + 1)}</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else if (message.startsWith('[ERROR]') || message.startsWith('[VMRUN_ERROR]') || message.startsWith('[CRITICAL_ERROR]') || message.startsWith('[AUTOMATION_FAILED]')) {
            p.innerHTML = `<span class="text-red-400 mr-1">${message.substring(0, message.indexOf(']') + 1)}</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else if (message.startsWith('[WARN]') || message.startsWith('[VMRUN_WARNING]')) {
            p.innerHTML = `<span class="text-yellow-400 mr-1">${message.substring(0, message.indexOf(']') + 1)}</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else if (message.startsWith('[STAGE]')) {
            p.innerHTML = `<span class="text-purple-400 mr-1">${message.substring(0, message.indexOf(']') + 1)}</span> ${message.substring(message.indexOf(']') + 2)}`;
        } else {
            p.textContent = message;
        }

        logViewer.appendChild(p);
        logViewer.scrollTop = logViewer.scrollHeight; // Auto-scroll
      }

      function updateFileLinks() {
        filesContainer.innerHTML = ''; // Clear placeholder or old links
        let foundFiles = false;

        if (generatedFilePaths.evtx) {
          const fileNameEvtx = generatedFilePaths.evtx.split(/\/|\\/).pop();
          const fileSizeEvtx = "N/A"; // Placeholder, actual size requires another call or info from script
          filesContainer.appendChild(createFileElement(fileNameEvtx, fileSizeEvtx, `/download/${encodeURIComponent(generatedFilePaths.evtx)}`));
          foundFiles = true;
        }
        if (generatedFilePaths.csv) {
          const fileNameCsv = generatedFilePaths.csv.split(/\/|\\/).pop();
          const fileSizeCsv = "N/A"; // Placeholder
          filesContainer.appendChild(createFileElement(fileNameCsv, fileSizeCsv, `/download/${encodeURIComponent(generatedFilePaths.csv)}`));
          foundFiles = true;
        }

        if (!foundFiles) {
            filesContainer.innerHTML = '<p class="text-text-secondary">No files generated or an error occurred.</p>';
        }
      }

      function createFileElement(name, size, downloadUrl) {
        const div = document.createElement('div');
        div.className = 'flex items-center gap-4 bg-background-secondary p-3 rounded-lg';
        div.innerHTML = `
          <div class="text-white flex items-center justify-center rounded-lg bg-gray-700 shrink-0 size-12">
            <svg fill="currentColor" height="28px" viewBox="0 0 256 256" width="28px" xmlns="http://www.w3.org/2000/svg">
              <path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Z"></path>
            </svg>
          </div>
          <div class="flex-1">
            <p class="font-medium">${name}</p>
            <p class="text-sm text-text-secondary">${size}</p>
          </div>
          <a href="${downloadUrl}" download="${name}" class="shrink-0 flex items-center justify-center size-10 rounded-full hover:bg-gray-700/50 transition-colors" title="Download ${name}">
            <svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">
              <path d="M224,152v56a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V152a8,8,0,0,1,16,0v56H208V152a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,132.69V40a8,8,0,0,0-16,0v92.69L93.66,106.34a8,8,0,0,0-11.32,11.32Z"></path>
            </svg>
          </a>`;
        return div;
      }


      runAutomationBtn.addEventListener('click', () => {
        if (runAutomationBtn.disabled) return;

        resetUI(); // Clear previous state before starting new one

        runAutomationBtn.disabled = true;
        runAutomationBtn.classList.add('opacity-50', 'cursor-not-allowed');
        runAutomationBtn.querySelector('span').textContent = 'Processing...';

        logViewer.innerHTML = '<p class="text-text-secondary">Initializing automation process...</p>';
        filesContainer.innerHTML = '<p class="text-text-secondary">Waiting for files...</p>';

        // Prepare status UI
        statusContainer.innerHTML = ''; // Clear "Waiting to start..."
        statusPhases.forEach(phase => {
            statusContainer.appendChild(new DOMParser().parseFromString(createStatusElement(phase.id, phase.text, 'pending'), 'text/html').body.firstChild);
        });


        eventSource = new EventSource('/run-automation');

        eventSource.onopen = () => {
          appendLogMessage('Connection to server established. Starting automation...');
        };

        eventSource.onmessage = (event) => {
          const message = event.data;
          appendLogMessage(message);
          updateStatusUI(message);

          if (message.startsWith("EVTX_FILE:")) {
            generatedFilePaths.evtx = message.substring("EVTX_FILE:".length).trim();
          } else if (message.startsWith("CSV_FILE:")) {
            generatedFilePaths.csv = message.substring("CSV_FILE:".length).trim();
          }

          if (message === 'SCRIPT_DONE' || message === 'SCRIPT_ERROR' || message === 'Automation completed successfully.' || message.includes("AUTOMATION_FAILED")) {
            eventSource.close();
            runAutomationBtn.disabled = false;
            runAutomationBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            runAutomationBtn.querySelector('span').textContent = 'Run Automation Again';

            // Ensure final status update if not already done by keyword
            if (message === 'SCRIPT_DONE' || message === 'Automation completed successfully.') {
                const completedPhase = statusPhases.find(p => p.id === 'completed');
                if(completedPhase) {
                    const statusEl = document.getElementById(`status-${completedPhase.id}`);
                    if (statusEl) {
                         const iconDiv = statusEl.querySelector('.status-icon');
                         iconDiv.classList.remove('bg-gray-500/20', 'text-gray-400', 'animate-pulse', 'bg-yellow-500/20', 'text-yellow-400');
                         iconDiv.classList.add('bg-green-500/20', 'text-green-400');
                         iconDiv.innerHTML = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path></svg>`;
                         statusEl.querySelector('.status-text').textContent = 'Completed';
                    }
                }
            } else if (message === 'SCRIPT_ERROR' || message.includes("AUTOMATION_FAILED")) {
                // Ensure last active or next pending phase is marked as error
                let errorPhaseIdx = currentPhaseIndex +1 < statusPhases.length ? currentPhaseIndex + 1 : currentPhaseIndex;
                errorPhaseIdx = errorPhaseIdx < 0 ? 0 : errorPhaseIdx; // handle case where no phase started

                if (errorPhaseIdx < statusPhases.length) {
                    const errorPhase = statusPhases[errorPhaseIdx];
                    const statusEl = document.getElementById(`status-${errorPhase.id}`);
                     if (statusEl) {
                        const iconDiv = statusEl.querySelector('.status-icon');
                        iconDiv.classList.remove('bg-gray-500/20', 'text-gray-400', 'animate-pulse', 'bg-yellow-500/20', 'text-yellow-400');
                        iconDiv.classList.add('bg-red-500/20', 'text-red-400');
                        // Error icon
                        iconDiv.innerHTML = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M128,24a104,104,0,1,0,232,128,104.11,104.11,0,0,0-128-24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,24a12,12,0,1,1-12-12A12,12,0,0,1,128,160Z"></path></svg>`;
                        statusEl.querySelector('.status-text').textContent = 'Error';
                    }
                }
                 appendLogMessage("Automation process ended with an error.");
            }
            updateFileLinks();
          }
        };

        eventSource.onerror = (err) => {
          console.error('EventSource failed:', err);
          appendLogMessage('Connection to server lost or an error occurred. Please check console.');
          // Mark the current or next phase as error
          let errorPhaseIdx = currentPhaseIndex +1 < statusPhases.length ? currentPhaseIndex + 1 : currentPhaseIndex;
          errorPhaseIdx = errorPhaseIdx < 0 ? 0 : errorPhaseIdx;
           if (errorPhaseIdx < statusPhases.length) {
              const errorPhase = statusPhases[errorPhaseIdx];
              const statusEl = document.getElementById(`status-${errorPhase.id}`);
               if (statusEl) {
                  const iconDiv = statusEl.querySelector('.status-icon');
                  iconDiv.classList.remove('bg-gray-500/20', 'text-gray-400', 'animate-pulse', 'bg-yellow-500/20', 'text-yellow-400');
                  iconDiv.classList.add('bg-red-500/20', 'text-red-400');
                  iconDiv.innerHTML = `<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg"><path d="M128,24a104,104,0,1,0,232,128,104.11,104.11,0,0,0-128-24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,24a12,12,0,1,1-12-12A12,12,0,0,1,128,160Z"></path></svg>`;
                  statusEl.querySelector('.status-text').textContent = 'Error';
              }
          }

          eventSource.close();
          runAutomationBtn.disabled = false;
          runAutomationBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          runAutomationBtn.querySelector('span').textContent = 'Run Automation Again';
          updateFileLinks(); // Show whatever files might have been found
        };
      });

      // Initialize UI on load
      resetUI();

    });
  </script>
</body>
